[browser]
gatherUsageStats = false

[server]
enableStaticServing = true
headless = true

[theme]
base = "dark"
font = "Manrope"
baseFontSize = 16
baseFontWeight = 400
headingFontSizes = ["1.85rem", "1.4rem", "1.18rem", "1.05rem", "0.95rem", "0.875rem"]
headingFontWeights = [650, 600, 600, 600, 600, 600]
metricValueFontSize = "1.65rem"
metricValueFontWeight = 650
baseRadius = "0.8rem"
buttonRadius = "0.7rem"
paddingTop = "0.75rem"
paddingBottom = "2.75rem"

primaryColor = "#4C9AFF"
backgroundColor = "#0c0f14"
secondaryBackgroundColor = "#161b24"
textColor = "#e7ebf2"
borderColor = "#2a3140"
dataframeBorderColor = "#2a3140"
dataframeHeaderBackgroundColor = "#141922"
dataframeHeaderTextColor = "#aeb6c4"
linkColor = "#8eb6ff"
linkUnderline = false
showWidgetBorder = true
showSidebarBorder = true

redColor = "#ff6b6b"
greenColor = "#3fb950"
blueColor = "#4C9AFF"
grayColor = "#8b95a5"
chartCategoricalColors = ["#4C9AFF", "#8b95a5", "#3fb950", "#ff7b72"]

[theme.sidebar]
backgroundColor = "#10141c"
secondaryBackgroundColor = "#171c26"
borderColor = "#262c38"

[theme.light]
primaryColor = "#0969da"
backgroundColor = "#f4f6f9"
secondaryBackgroundColor = "#ffffff"
textColor = "#1b212c"
borderColor = "#e3e7ee"
dataframeBorderColor = "#e3e7ee"
dataframeHeaderBackgroundColor = "#f7f8fb"
dataframeHeaderTextColor = "#5c6778"
linkColor = "#0969da"
redColor = "#cf222e"
greenColor = "#1a7f37"
blueColor = "#0969da"
grayColor = "#667085"
chartCategoricalColors = ["#0969da", "#8b95a5", "#1a7f37", "#cf222e"]

[theme.light.sidebar]
backgroundColor = "#fbfcfe"
secondaryBackgroundColor = "#f3f5f8"
borderColor = "#e6e9ef"

[[theme.fontFaces]]
family = "Manrope"
url = "app/static/fonts/manrope-latin.woff2"
weight = "200 800"
style = "normal"
unicodeRange = "U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD"

[[theme.fontFaces]]
family = "Manrope"
url = "app/static/fonts/manrope-latin-ext.woff2"
weight = "200 800"
style = "normal"
unicodeRange = "U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF"

[[theme.fontFaces]]
family = "Manrope"
url = "app/static/fonts/manrope-cyrillic.woff2"
weight = "200 800"
style = "normal"
unicodeRange = "U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116"
