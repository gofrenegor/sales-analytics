# Example reverse-proxy server block. Enable ngx_brotli in nginx before using.
server {
    listen 443 ssl http2;
    server_name analytics.example.com;

    # ssl_certificate and ssl_certificate_key are managed by the host.

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The app sends uncompressed bodies; nginx negotiates one encoding.
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_comp_level 5;
        gzip_types application/json text/css application/javascript text/javascript;

        brotli on;
        brotli_comp_level 5;
        brotli_min_length 1024;
        brotli_types application/json text/css application/javascript text/javascript;
    }
}
