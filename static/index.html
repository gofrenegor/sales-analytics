<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Аналитика списаний</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📦%3C/text%3E%3C/svg%3E">
  <link rel="preload" href="/static/fonts/manrope-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/styles.css?v=2">
  <script>
    (function () {
      try {
        var theme = localStorage.getItem("theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="gate" class="gate" hidden>
    <p class="gate-title">вы не зарегистрированы</p>
    <form id="gate-form" class="gate-form">
      <span class="mail-line" id="gate-line">
        <input id="gate-contact" autocomplete="username" placeholder="телефон или почта" aria-label="Телефон или ник почты" enterkeyhint="next">
        <span class="mail-at" id="gate-at" hidden aria-hidden="true">@</span>
        <select id="gate-domain" hidden aria-label="Домен почты">
          <option value="gmail.com">gmail.com</option>
          <option value="mail.ru">mail.ru</option>
        </select>
      </span>
      <input id="gate-password" type="password" autocomplete="current-password" placeholder="пароль" aria-label="Пароль" enterkeyhint="go">
      <button type="submit" class="primary">Войти</button>
      <p id="gate-error" class="gate-error" hidden role="alert"></p>
    </form>
  </div>
  <button type="button" id="admin-toggle" class="admin-toggle" hidden aria-controls="sidebar" aria-expanded="false" aria-label="Админ-панель">
    <span class="hamburger" aria-hidden="true"><span></span><span></span><span></span></span>
  </button>
  <div class="layout" hidden>
    <aside id="sidebar">
      <div id="who" class="account-id">
        <span class="grant-id-kicker">ID</span>
        <span class="grant-id-value" id="who-id">—</span>
      </div>
      <h2 id="sidebar-title">👤 Админ-панель</h2>
      <details id="admin-info" class="panel">
        <summary>ℹ️ Инфо</summary>
        <details id="info-lr" class="panel">
          <summary>Lostreason</summary>
          <div id="info-lr-list"></div>
        </details>
        <details id="info-statuses" class="panel">
          <summary>статусы</summary>
          <label class="st-find">
            <span class="sr">Код или статус</span>
            <input id="status-search" type="search" placeholder="код или статус" autocomplete="off" enterkeyhint="search">
          </label>
          <div id="info-status-list"></div>
        </details>
      </details>
      <details id="password-fold" class="panel">
        <summary>Смена пароля</summary>
        <form id="password-panel" class="password-panel">
          <input id="password-next" autocomplete="new-password" maxlength="64" placeholder="новый пароль" spellcheck="false" aria-label="Новый пароль">
          <button type="button" id="password-random" class="ghost">случайный</button>
          <button type="submit" class="primary">сохранить</button>
          <p id="password-note" class="password-note" hidden role="status"></p>
        </form>
      </details>
      <div class="admin-only">
      <label class="grant-phone">
        <span class="grant-id-kicker">Мой телефон</span>
        <input id="own-phone" inputmode="tel" autocomplete="tel" placeholder="+7" aria-label="Мой телефон">
      </label>
      <label class="grant-phone">
        <span class="grant-id-kicker">Моя почта</span>
        <span class="mail-line email">
          <input id="own-email" autocomplete="off" placeholder="ник" aria-label="Ник моей почты">
          <span class="mail-at" aria-hidden="true">@</span>
          <select id="own-domain" aria-label="Домен моей почты">
            <option value="gmail.com">gmail.com</option>
            <option value="mail.ru">mail.ru</option>
          </select>
        </span>
      </label>
      <button type="button" id="own-phone-save" class="wide ghost">Сохранить мои контакты</button>
      <button type="button" id="grant-toggle" class="wide ghost" aria-expanded="false" aria-controls="grant-panel">Выдать доступ</button>
      <div id="grant-panel" class="grant-panel" hidden>
        <div class="grant-id" aria-disabled="true">
          <span class="grant-id-kicker">ID</span>
          <span class="grant-id-value" id="grant-id-value">—</span>
        </div>
        <label class="grant-phone">
          <span class="grant-id-kicker">Телефон</span>
          <input id="grant-phone" inputmode="tel" autocomplete="off" placeholder="+7" aria-label="Телефон для этого ID">
        </label>
        <label class="grant-phone">
          <span class="grant-id-kicker">Почта</span>
          <span class="mail-line email">
            <input id="grant-email" autocomplete="off" placeholder="ник" aria-label="Ник почты для этого ID">
            <span class="mail-at" aria-hidden="true">@</span>
            <select id="grant-domain" aria-label="Домен почты для этого ID">
              <option value="gmail.com">gmail.com</option>
              <option value="mail.ru">mail.ru</option>
            </select>
          </span>
        </label>
        <div class="grant-roles" role="radiogroup" aria-label="Права">
          <label class="grant-role">
            <input type="radio" name="grant-role" value="view">
            <b>Просмотр</b>
            <span>смотреть сайт, блоки, потоки, деталку</span>
          </label>
          <label class="grant-role">
            <input type="radio" name="grant-role" value="admin">
            <b>Админка</b>
            <span>весь функционал</span>
          </label>
        </div>
        <button type="button" id="grant-submit" class="wide primary" disabled>Выдать</button>
        <div id="grant-secret" class="grant-secret" hidden>
          <span class="grant-id-kicker">Пароль</span>
          <input id="grant-secret-value" class="grant-secret-value" readonly spellcheck="false" autocomplete="off" aria-label="Пароль пользователя">
        </div>
        <p id="grant-status" class="hint" hidden></p>
      </div>
      <button type="button" id="cache-btn" class="wide ghost">🔄 Сбросить кэш данных</button>
      <button type="button" id="theme" class="wide ghost">🌓 Тема</button>
      <p id="admin-status" class="hint" hidden></p>
      <details class="panel" open>
        <summary>📥 Загрузка данных</summary>
        <div class="upload-kind" role="radiogroup" aria-label="Тип выгрузки">
          <label class="grant-role">
            <input id="upload-kind-superset" type="radio" name="upload-kind" value="superset" checked>
            <b>Суперсет</b>
            <span>все потери. Заменяет период</span>
          </label>
          <label class="grant-role">
            <input id="upload-kind-twin" type="radio" name="upload-kind" value="twin">
            <b>Twin</b>
            <span>только МХ пропуска 5 ЛР. Дописывает место по ШК</span>
          </label>
        </div>
        <label class="file">
          <span>Excel файлы (.xlsx)</span>
          <input id="files" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" multiple>
        </label>
        <div id="upload-preview"></div>
      </details>
      <details id="db-fold" class="panel">
        <summary>что в базе</summary>
        <div id="info-main" class="info-admin">
          <p class="info-label">Основная информация</p>
          <div id="period-note" class="period-note" hidden></div>
          <p id="compare-note" class="hint" hidden></p>
        </div>
        <details id="quality" class="panel info-admin" hidden>
          <summary>Проверка данных</summary>
          <div id="quality-body"></div>
        </details>
        <div id="db-summary"></div>
        <hr>
        <label class="check"><input type="checkbox" id="sure"> Я уверен, что хочу удалить всё</label>
        <button type="button" id="wipe" class="wide danger" disabled>🗑️ Очистить базу</button>
      </details>
      </div>
      <button type="button" id="logout-btn" class="wide ghost">выйти</button>
    </aside>
    <div id="backdrop"></div>
    <main>
      <header class="top">
        <h1>📦 Аналитика списаний</h1>
        <label class="search">
          <span class="sr">Поиск LR или площадки</span>
          <input id="search" type="search" placeholder="LR или площадка" autocomplete="off" enterkeyhint="search">
          <div id="search-hits" class="search-hits" hidden></div>
        </label>
      </header>
      <nav class="sections" aria-label="Раздел">
        <div class="wh">
          <button type="button" id="section-losses" aria-pressed="true">Склад</button>
          <svg class="wh-lines" aria-hidden="true" focusable="false" width="0" height="0">
            <line id="slice-line-blocks"></line>
            <line id="slice-line-flows"></line>
          </svg>
          <div class="wh-fork">
            <button type="button" id="slice-blocks" aria-pressed="false">блоки</button>
            <button type="button" id="slice-flows" aria-pressed="false">потоки</button>
          </div>
        </div>
        <button type="button" id="section-employees" aria-pressed="false">Сотрудники</button>
      </nav>
      <p id="banner" class="box bad" hidden role="alert"></p>
      <p id="status" class="status" hidden role="status"></p>
      <form id="dates" class="dates">
        <fieldset>
          <legend>Выберите разрез:</legend>
          <div class="modes">
            <span class="mode-glider" aria-hidden="true"></span>
            <label><input type="radio" name="mode" value="День"> День</label>
            <label><input type="radio" name="mode" value="Неделя"> Неделя</label>
            <label><input type="radio" name="mode" value="Месяц" checked> Месяц</label>
            <label><input type="radio" name="mode" value="Свободный"> Свободный</label>
          </div>
        </fieldset>
        <div class="pickers" id="pickers">
          <span id="anchor-label">Выберите месяц</span>
          <div class="picker-row" role="group" aria-labelledby="anchor-label">
            <div class="picker" data-picker="day" hidden>
              <button type="button" class="picker-btn" id="picker-day-btn" aria-haspopup="listbox" aria-expanded="false" aria-controls="picker-day-menu">
                <span class="picker-main">
                  <span class="picker-kicker" id="picker-day-kicker"></span>
                  <span class="picker-value" id="picker-day-value">—</span>
                </span>
                <span class="picker-caret" aria-hidden="true"></span>
              </button>
              <div class="picker-menu" id="picker-day-menu" role="listbox" aria-label="День" hidden></div>
            </div>
            <div class="picker" data-picker="week" hidden>
              <button type="button" class="picker-btn" id="picker-week-btn" aria-haspopup="listbox" aria-expanded="false" aria-controls="picker-week-menu">
                <span class="picker-main">
                  <span class="picker-value" id="picker-week-value">—</span>
                </span>
                <span class="picker-caret" aria-hidden="true"></span>
              </button>
              <div class="picker-menu" id="picker-week-menu" role="listbox" aria-label="Неделя" hidden></div>
            </div>
            <div class="picker" data-picker="month">
              <button type="button" class="picker-btn" id="picker-month-btn" aria-haspopup="listbox" aria-expanded="false" aria-controls="picker-month-menu">
                <span class="picker-main">
                  <span class="picker-value" id="picker-month-value">—</span>
                </span>
                <span class="picker-caret" aria-hidden="true"></span>
              </button>
              <div class="picker-menu" id="picker-month-menu" role="listbox" aria-label="Месяц" hidden></div>
            </div>
            <div class="picker" data-picker="year">
              <button type="button" class="picker-btn" id="picker-year-btn" aria-haspopup="listbox" aria-expanded="false" aria-controls="picker-year-menu">
                <span class="picker-main">
                  <span class="picker-value" id="picker-year-value">—</span>
                </span>
                <span class="picker-caret" aria-hidden="true"></span>
              </button>
              <div class="picker-menu" id="picker-year-menu" role="listbox" aria-label="Год" hidden></div>
            </div>
          </div>
        </div>
        <label class="anchor" id="anchor-wrap" hidden>
          <span class="ymd">
            <input id="anchor-day" class="ymd-day" type="text" inputmode="numeric" maxlength="2" placeholder="дд" autocomplete="off" spellcheck="false" aria-label="День">
            <span class="ymd-dot" aria-hidden="true">.</span>
            <input id="anchor-month" class="ymd-month" type="text" inputmode="numeric" maxlength="2" placeholder="мм" autocomplete="off" spellcheck="false" aria-label="Месяц">
            <span class="ymd-dot" aria-hidden="true">.</span>
            <input id="anchor-year" class="ymd-year" type="text" inputmode="numeric" maxlength="4" value="2026" tabindex="-1" autocomplete="off" spellcheck="false" aria-label="Год">
            <span class="ymd-cal" aria-hidden="true">📅</span>
            <input id="anchor" class="ymd-native" type="date" tabindex="-1" aria-label="Календарь">
          </span>
          <p class="ymd-error" id="anchor-error" hidden role="alert">некорректная дата</p>
        </label>
        <div class="range" id="range-wrap" hidden>
          <label class="anchor">
            <span>С</span>
            <span class="ymd">
              <input id="range-start-day" class="ymd-day" type="text" inputmode="numeric" maxlength="2" placeholder="дд" autocomplete="off" spellcheck="false" aria-label="День, с">
              <span class="ymd-dot" aria-hidden="true">.</span>
              <input id="range-start-month" class="ymd-month" type="text" inputmode="numeric" maxlength="2" placeholder="мм" autocomplete="off" spellcheck="false" aria-label="Месяц, с">
              <span class="ymd-dot" aria-hidden="true">.</span>
              <input id="range-start-year" class="ymd-year" type="text" inputmode="numeric" maxlength="4" value="2026" tabindex="-1" autocomplete="off" spellcheck="false" aria-label="Год, с">
              <span class="ymd-cal" aria-hidden="true">📅</span>
              <input id="range-start" class="ymd-native" type="date" tabindex="-1" aria-label="Календарь, с">
            </span>
            <p class="ymd-error" id="range-start-error" hidden role="alert">некорректная дата</p>
          </label>
          <label class="anchor">
            <span>По</span>
            <span class="ymd">
              <input id="range-end-day" class="ymd-day" type="text" inputmode="numeric" maxlength="2" placeholder="дд" autocomplete="off" spellcheck="false" aria-label="День, по">
              <span class="ymd-dot" aria-hidden="true">.</span>
              <input id="range-end-month" class="ymd-month" type="text" inputmode="numeric" maxlength="2" placeholder="мм" autocomplete="off" spellcheck="false" aria-label="Месяц, по">
              <span class="ymd-dot" aria-hidden="true">.</span>
              <input id="range-end-year" class="ymd-year" type="text" inputmode="numeric" maxlength="4" value="2026" tabindex="-1" autocomplete="off" spellcheck="false" aria-label="Год, по">
              <span class="ymd-cal" aria-hidden="true">📅</span>
              <input id="range-end" class="ymd-native" type="date" tabindex="-1" aria-label="Календарь, по">
            </span>
            <p class="ymd-error" id="range-end-error" hidden role="alert">некорректная дата</p>
          </label>
        </div>
      </form>
      <div id="screen"></div>
    </main>
  </div>
  <script src="/static/app.js?v=2"></script>
  <script src="/static/info-copy.js?v=2"></script>
  <noscript><p class="box warn">Для дашборда нужен JavaScript.</p></noscript>
</body>
</html>
